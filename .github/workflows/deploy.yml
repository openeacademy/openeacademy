name: Deploy to VPS

on:
  push:
    branches: [main]
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Cancel any in-progress deployment if a new push arrives
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ── Job 1: Validate (fast checks before deploying) ─────────────────────────
  validate:
    name: Type-check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Backend type-check ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --frozen-lockfile

      - name: Generate Prisma client (needed for type-check)
        working-directory: backend
        run: npx prisma generate

      - name: TypeScript check — backend
        working-directory: backend
        run: npx tsc --noEmit

      # ── Web type-check ────────────────────────────────────────────────────
      - name: Install web dependencies
        working-directory: web
        run: npm ci --frozen-lockfile

      - name: TypeScript check — web
        working-directory: web
        run: npx tsc --noEmit

      # ── Admin type-check ──────────────────────────────────────────────────
      - name: Install admin dependencies
        working-directory: admin
        run: npm ci --frozen-lockfile

      - name: TypeScript check — admin
        working-directory: admin
        run: npx tsc --noEmit

  # ── Job 2: Deploy (only after validate passes) ──────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: validate   # only run if validate succeeds

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          script: |
            set -e  # Exit immediately on any error

            echo "📦 Navigating to project directory..."
            cd ${{ secrets.VPS_PATH }}

            echo "🔄 Pulling latest code from main..."
            git pull origin main

            echo "🐳 Building and restarting containers..."
            docker compose up -d --build --remove-orphans

            echo "🧹 Pruning unused Docker images..."
            docker image prune -f

            echo "✅ Deployment complete!"
            echo "🌐 Web:    https://openeacademy.in"
            echo "🔑 Admin:  https://openeacademy.in/admin"
            echo "🔌 API:    https://api.openeacademy.in"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
          exit 1
