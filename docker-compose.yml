# ─────────────────────────────────────────────────────────────────────────────
#  Open E Academy — Production Docker Compose
#  Domain:  openeacademy.in
#  Stack:   Traefik (SSL) → Web | Admin | Backend → Postgres | Redis
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Traefik Reverse Proxy + SSL ───────────────────────────────────────────
  traefik:
    image: traefik:v2.11
    container_name: opene-traefik
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.41
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Docker socket (read-only) for dynamic service discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Static config
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic config (middlewares, etc.)
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      # Let's Encrypt certificate storage
      # IMPORTANT: run `touch traefik/acme/acme.json && chmod 600 traefik/acme/acme.json` before first deploy
      - ./traefik/acme:/etc/traefik/acme
    networks:
      - proxy
    labels:
      - "traefik.enable=false"  # Traefik doesn't route to itself

  # ── Web App (openeacademy.in & www.openeacademy.in) ─────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: opene-web
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Route: openeacademy.in or www.openeacademy.in (Admin has higher priority)
      - "traefik.http.routers.web.rule=Host(`openeacademy.in`) || Host(`www.openeacademy.in`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=secure-headers@file"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  # ── Admin Panel (openeacademy.in/admin & www.openeacademy.in/admin) ────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: opene-admin
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Route: openeacademy.in/admin or www.openeacademy.in/admin
      - "traefik.http.routers.admin.rule=(Host(`openeacademy.in`) || Host(`www.openeacademy.in`)) && PathPrefix(`/admin`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      # Strip /admin prefix before forwarding to nginx, then apply security headers
      - "traefik.http.routers.admin.middlewares=admin-strip-prefix@file,secure-headers@file"
      - "traefik.http.routers.admin.priority=10"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

  # ── Backend API (api.openeacademy.in) ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opene-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.openeacademy.in`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=secure-headers@file,api-rate-limit@file"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: opene-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       ${POSTGRES_DB:-opene_academy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # NOT exposed to host/internet — only reachable by backend inside `internal` network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-opene_academy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: opene-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - internal
    # NOT exposed to host/internet
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # Public-facing: Traefik + web/admin/backend containers
  proxy:
    driver: bridge

  # Private: backend ↔ postgres ↔ redis only (not reachable from internet)
  internal:
    driver: bridge
    internal: true

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
