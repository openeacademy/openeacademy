server {
    listen       80;
    server_name  _;

    # After Traefik strips the /admin prefix, nginx serves from root.
    # Vite built with base: '/admin/' so asset paths in HTML are /admin/assets/...
    # Browser requests /admin/assets/foo.js → Traefik routes to admin (PathPrefix /admin)
    # → strips /admin → nginx sees /assets/foo.js → serves from /usr/share/nginx/html/assets/foo.js ✓
    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ───────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ── SPA fallback ───────────────────────────────────────────
    # Traefik has already stripped /admin, so all paths arrive here without it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ── Long-term caching for hashed assets ───────────────────
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
